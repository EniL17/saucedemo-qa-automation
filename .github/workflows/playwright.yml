name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    # NOTE: This suite intentionally contains ~45 failing tests. Each one is a
    # regression check for a confirmed, documented defect (see the manual test
    # case sheet). A red build here is expected and meaningful: it confirms the
    # known defects are still present. If this build ever turns fully green, it
    # means one or more defects were fixed and the test case documentation
    # should be updated to reflect that.
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: test-results-json
        path: test-results/
        retention-days: 30